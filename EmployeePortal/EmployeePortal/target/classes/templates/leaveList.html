<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Leave Requests</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><a class="brand" th:href="@{/}">Employee Portal</a><div><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/employees}">Employees</a><a th:href="@{/assets}">Assets</a></div></nav><main class="container"><div class="page-head"><div><span class="eyebrow">Time off</span><h1>Leave Requests</h1></div><a class="btn primary" th:href="@{/leaves/apply}">+ Apply Leave</a></div><div class="table-card"><table><thead><tr><th>Employee</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="leave : ${leaves}"><td th:text="${leave.employee.name}"></td><td th:text="${leave.fromDate}"></td><td th:text="${leave.toDate}"></td><td th:text="${leave.totalDays}"></td><td th:text="${leave.reason}"></td><td><span class="badge" th:classappend="${#strings.toLowerCase(leave.status)}" th:text="${leave.status}"></span></td><td class="row-actions"><a th:if="${leave.status == 'PENDING'}" th:href="@{/leaves/approve/{id}(id=${leave.id})}">Approve</a><a th:if="${leave.status == 'PENDING'}" th:href="@{/leaves/reject/{id}(id=${leave.id})}">Reject</a><a class="danger" th:href="@{/leaves/delete/{id}(id=${leave.id})}" onclick="return confirm('Delete this leave request?')">Delete</a></td></tr><tr th:if="${#lists.isEmpty(leaves)}"><td colspan="7" class="empty">No leave requests yet.</td></tr></tbody></table></div></main></body></html>
