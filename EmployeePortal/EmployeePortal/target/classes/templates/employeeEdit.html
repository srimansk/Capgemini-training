<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Edit Employee</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<nav><a class="brand" th:href="@{/}">Employee Portal</a><div><a th:href="@{/employees}">Employees</a></div></nav><main class="form-wrap"><div class="form-card"><span class="eyebrow">Update record</span><h1>Edit Employee</h1><form th:action="@{/employees/update/{id}(id=${employee.id})}" th:object="${employee}" method="post"><div class="grid2"><label>Name<input th:field="*{name}" placeholder="Employee name"><small th:errors="*{name}"></small></label><label>Email<input type="email" th:field="*{email}" placeholder="name@company.com"><small th:errors="*{email}"></small></label><label>Phone<input th:field="*{phone}" placeholder="10 digit phone"><small th:errors="*{phone}"></small></label><label>Department<input th:field="*{department}" placeholder="Engineering"><small th:errors="*{department}"></small></label><label>Designation<input th:field="*{designation}" placeholder="Software Engineer"><small th:errors="*{designation}"></small></label><label>Joining Date<input type="date" th:field="*{joiningDate}"><small th:errors="*{joiningDate}"></small></label><label class="full">Salary<input type="number" step="0.01" th:field="*{salary}" placeholder="50000"><small th:errors="*{salary}"></small></label></div><div class="actions"><button class="btn primary" type="submit">Update Employee</button><a class="btn secondary" th:href="@{/employees}">Cancel</a></div></form></div></main></body></html>
