<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Employee Profile</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><a class="brand" th:href="@{/}">Employee Portal</a><div><a th:href="@{/employees}">Employees</a><a th:href="@{/leaves}">Leaves</a><a th:href="@{/assets}">Assets</a></div></nav><main class="container"><div class="profile-card"><div class="avatar" th:text="${#strings.substring(employee.name,0,1)}">E</div><div class="profile-title"><span class="eyebrow">Employee profile</span><h1 th:text="${employee.name}"></h1><p th:text="${employee.designation + ' · ' + employee.department}"></p></div><div class="actions"><a class="btn secondary" th:href="@{/employees/edit/{id}(id=${employee.id})}">Edit Profile</a></div></div><div class="details"><div><span>Email</span><b th:text="${employee.email}"></b></div><div><span>Phone</span><b th:text="${employee.phone}"></b></div><div><span>Joining Date</span><b th:text="${employee.joiningDate}"></b></div><div><span>Salary</span><b th:text="${'₹ ' + #numbers.formatDecimal(employee.salary,0,'COMMA',2,'POINT')}"></b></div></div><div class="actions"><a class="btn primary" th:href="@{/leaves/apply}">Apply Leave</a><a class="btn primary" th:href="@{/assets/request}">Request Asset</a><a class="btn secondary" th:href="@{/employees}">Back</a></div></main></body></html>
