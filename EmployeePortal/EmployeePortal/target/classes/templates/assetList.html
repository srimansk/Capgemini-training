<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Asset Requests</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><a class="brand" th:href="@{/}">Employee Portal</a><div><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/employees}">Employees</a><a th:href="@{/leaves}">Leaves</a></div></nav><main class="container"><div class="page-head"><div><span class="eyebrow">Equipment</span><h1>Asset Requests</h1></div><a class="btn primary" th:href="@{/assets/request}">+ Request Asset</a></div><div class="table-card"><table><thead><tr><th>Employee</th><th>Asset</th><th>Type</th><th>Qty</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="asset : ${assets}"><td th:text="${asset.employee.name}"></td><td th:text="${asset.assetName}"></td><td th:text="${asset.assetType}"></td><td th:text="${asset.quantity}"></td><td th:text="${asset.requestDate}"></td><td><span class="badge" th:classappend="${#strings.toLowerCase(asset.status)}" th:text="${asset.status}"></span></td><td class="row-actions"><a th:if="${asset.status == 'PENDING'}" th:href="@{/assets/approve/{id}(id=${asset.id})}">Approve</a><a th:if="${asset.status == 'PENDING'}" th:href="@{/assets/reject/{id}(id=${asset.id})}">Reject</a><a th:if="${asset.status == 'APPROVED'}" th:href="@{/assets/deliver/{id}(id=${asset.id})}">Deliver</a><a class="danger" th:href="@{/assets/delete/{id}(id=${asset.id})}" onclick="return confirm('Delete this asset request?')">Delete</a></td></tr><tr th:if="${#lists.isEmpty(assets)}"><td colspan="7" class="empty">No asset requests yet.</td></tr></tbody></table></div></main></body></html>
