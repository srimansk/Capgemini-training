<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Request Asset</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><a class="brand" th:href="@{/}">Employee Portal</a><div><a th:href="@{/assets}">Asset Requests</a></div></nav><main class="form-wrap"><div class="form-card"><span class="eyebrow">New request</span><h1>Request an Asset</h1><form th:action="@{/assets/save}" th:object="${asset}" method="post"><label>Employee<select name="employeeId" required><option value="">Select employee</option><option th:each="employee : ${employees}" th:value="${employee.id}" th:text="${employee.name + ' - ' + employee.department}"></option></select></label><div class="grid2"><label>Asset Name<input th:field="*{assetName}" placeholder="MacBook Pro"><small th:errors="*{assetName}"></small></label><label>Asset Type<input th:field="*{assetType}" placeholder="Laptop"><small th:errors="*{assetType}"></small></label><label>Quantity<input type="number" min="1" th:field="*{quantity}"><small th:errors="*{quantity}"></small></label><label>Request Date<input type="date" th:field="*{requestDate}"></label></div><div class="actions"><button class="btn primary" type="submit">Submit Request</button><a class="btn secondary" th:href="@{/assets}">Cancel</a></div></form></div></main></body></html>
