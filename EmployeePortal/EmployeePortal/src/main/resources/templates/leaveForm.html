<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Apply Leave</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><a class="brand" th:href="@{/}">Employee Portal</a><div><a th:href="@{/leaves}">Leave Requests</a></div></nav><main class="form-wrap"><div class="form-card"><span class="eyebrow">New request</span><h1>Apply for Leave</h1><form th:action="@{/leaves/save}" th:object="${leave}" method="post"><label>Employee<select name="employeeId" required><option value="">Select employee</option><option th:each="employee : ${employees}" th:value="${employee.id}" th:text="${employee.name + ' - ' + employee.department}"></option></select></label><div class="grid2"><label>From Date<input type="date" th:field="*{fromDate}"><small th:errors="*{fromDate}"></small></label><label>To Date<input type="date" th:field="*{toDate}"><small th:errors="*{toDate}"></small></label></div><label>Reason<textarea th:field="*{reason}" rows="4" placeholder="Enter reason for leave"></textarea><small th:errors="*{reason}"></small></label><div class="actions"><button class="btn primary" type="submit">Submit Request</button><a class="btn secondary" th:href="@{/leaves}">Cancel</a></div></form></div></main></body></html>
