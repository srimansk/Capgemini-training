<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Employees</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<nav><a class="brand" th:href="@{/}">Employee Portal</a><div><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/leaves}">Leaves</a><a th:href="@{/assets}">Assets</a></div></nav>
<main class="container"><div class="page-head"><div><span class="eyebrow">People</span><h1>Employees</h1><p>View and manage employee records.</p></div><a class="btn primary" th:href="@{/employees/add}">+ Add Employee</a></div>
<div class="table-card"><table><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Designation</th><th>Email</th><th>Actions</th></tr></thead><tbody><tr th:each="employee : ${employees}"><td th:text="${employee.id}"></td><td><a class="name-link" th:href="@{/employees/{id}(id=${employee.id})}" th:text="${employee.name}"></a></td><td th:text="${employee.department}"></td><td th:text="${employee.designation}"></td><td th:text="${employee.email}"></td><td class="row-actions"><a th:href="@{/employees/{id}(id=${employee.id})}">View</a><a th:href="@{/employees/edit/{id}(id=${employee.id})}">Edit</a><a class="danger" th:href="@{/employees/delete/{id}(id=${employee.id})}" onclick="return confirm('Delete this employee?')">Delete</a></td></tr><tr th:if="${#lists.isEmpty(employees)}"><td colspan="6" class="empty">No employees found. Add your first employee.</td></tr></tbody></table></div></main>
</body></html>
