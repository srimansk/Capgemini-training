spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Auth Service
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# Ticket Service
spring.cloud.gateway.server.webmvc.routes[1].id=ticket-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ticket-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/tickets/**

# Notification Service
spring.cloud.gateway.server.webmvc.routes[2].id=notification-service-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/notifications/**